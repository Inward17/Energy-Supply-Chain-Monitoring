<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPR Optimizer mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#5AAEFF}a:hover{color:#9CCEFF}
</style>
</helmet>
<div style="width: 390px; height: 1400px; box-sizing: border-box; background: #07090C; color: #E6EAEF; font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 12px; border-bottom: 1px solid #1A212A; background: #0A0D11">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#0F1C2B" stroke="#24405F"></circle><path d="M16 4v24M4 16h24" stroke="#24405F" stroke-width="1"></path><circle cx="16" cy="16" r="6" fill="none" stroke="#5AAEFF" stroke-width="2"></circle><circle cx="16" cy="16" r="2" fill="#5AAEFF"></circle></svg>
      <span style="font-size: 16px; font-weight: 700; color: #F5F7FA">SPR Optimizer</span>
    </div>
    <a href="#" aria-label="Model assumptions" style="height: 44px; width: 44px; border-radius: 12px; border: 1px solid #252F3B; background: #0F141A; color: #AEB8C5; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"></path></svg></a>
  </header>

  <nav aria-label="Respond tools" style="padding: 12px 16px; border-bottom: 1px solid #1A212A">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px; border-radius: 12px; background: #0E1319; border: 1px solid #1E2731">
      <a href="M-War.dc.html" style="min-height: 40px; border-radius: 9px; background: transparent; color: #AEB8C5; font-size: 13px; display: flex; align-items: center; justify-content: center; text-decoration: none">War Room</a>
      <a href="M-Reroute.dc.html" style="min-height: 40px; border-radius: 9px; background: transparent; color: #AEB8C5; font-size: 13px; display: flex; align-items: center; justify-content: center; text-decoration: none">Reroute</a>
      <a href="#" aria-current="page" style="min-height: 40px; border-radius: 9px; background: #1A2330; color: #F5F7FA; font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center; text-decoration: none">SPR</a>
    </div>
  </nav>

  <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px">

    <!-- Inputs -->
    <div style="background: #0E1319; border: 1px solid #1E2731; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #94A0AF">BLOCKED</span>
        <select style="height: 48px; border-radius: 10px; border: 1px solid #FF8A3D; background: #1A1410; color: #F5F7FA; padding: 0 12px; font-family: Archivo, sans-serif; font-size: 15px"><option>Strait of Hormuz</option></select></label>
      <label style="display: flex; flex-direction: column; gap: 6px"><span style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #94A0AF">LEAD TIME <span style="font-size: 13px; color: #F5F7FA">30 days</span></span>
        <input type="range" min="0" max="90" value="30" style="width: 100%; height: 32px; accent-color: #5AAEFF"></label>
    </div>

    <!-- Verdict pair -->
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="background: #1C0F11; border: 1px solid #44201F; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: #FF8A8D">NO ACTION</span>
        <span style="font-size: 28px; font-weight: 700; font-stretch: 108%; color: #F5F7FA">18.1 d</span>
        <span style="font-size: 11px; color: #AEB8C5">11.9 d short</span>
      </div>
      <div style="background: #0D1A14; border: 1px solid #1E4A36; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: #3FCF8E">WITH LEVERS</span>
        <span style="font-size: 28px; font-weight: 700; font-stretch: 108%; color: #F5F7FA">103.2 d</span>
        <span style="font-size: 11px; color: #AEB8C5">gap closed</span>
      </div>
    </div>

    <!-- Burn-down -->
    <figure style="margin: 0; background: #0E1319; border: 1px solid #1E2731; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 15px; font-weight: 700; color: #F5F7FA">Reserve level</span>
        <div style="display: flex; gap: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #94A0AF">
          <span style="display: flex; align-items: center; gap: 4px"><span style="width: 10px; height: 3px; background: #FF5A5F"></span>none</span>
          <span style="display: flex; align-items: center; gap: 4px"><span style="width: 10px; height: 3px; background: #3FCF8E"></span>levers</span>
        </div>
      </div>
      <svg viewBox="0 0 640 220" width="100%" role="img" aria-label="Without action the reserve is empty from day 18 to day 30; with levers it bottoms at 71%">
        <rect x="320" y="0" width="244.7" height="196" fill="#1C0F11" opacity="0.8"></rect>
        <line x1="564.7" y1="0" x2="564.7" y2="196" stroke="#5AAEFF" stroke-width="2" stroke-dasharray="6 6"></line>
        <path d="M0.0 14.6 L18.8 25.3 L37.6 35.9 L56.5 46.6 L75.3 57.2 L94.1 67.7 L112.9 78.5 L131.8 89.1 L150.6 99.6 L169.4 110.4 L188.2 120.9 L207.1 131.7 L225.9 142.2 L244.7 152.8 L263.5 163.6 L282.4 174.1 L301.2 184.9 L320.0 195.4 L338.8 196.0 L545.9 196.0 L564.7 190.6 L583.5 185.4 L602.4 180.1 L621.2 174.7 L640.0 169.5" fill="none" stroke="#FF5A5F" stroke-width="5" stroke-linejoin="round"></path>
        <path d="M0.0 5.9 L94.1 15.1 L188.2 24.5 L282.4 33.8 L376.5 43.2 L470.6 52.4 L545.9 59.9 L564.7 58.9 L640.0 55.3" fill="none" stroke="#3FCF8E" stroke-width="5" stroke-linejoin="round"></path>
        <text x="442" y="120" text-anchor="middle" fill="#FF8A8D" font-family="IBM Plex Mono, monospace" font-size="22">empty</text>
        <text x="0" y="216" fill="#7A8697" font-family="IBM Plex Mono, monospace" font-size="20">day 0</text>
        <text x="564" y="216" text-anchor="middle" fill="#5AAEFF" font-family="IBM Plex Mono, monospace" font-size="20">30</text>
      </svg>
    </figure>

    <!-- Levers -->
    <section aria-labelledby="msl-h" style="background: #0E1319; border: 1px solid #1E2731; border-radius: 18px; padding: 8px 14px; display: flex; flex-direction: column">
      <h2 id="msl-h" style="margin: 0; padding: 10px 0; font-size: 15px; font-weight: 700; color: #F5F7FA">Demand levers</h2>
      <label style="display: flex; gap: 12px; align-items: center; min-height: 56px; border-top: 1px solid #1A222C"><input type="checkbox" checked="checked" style="width: 22px; height: 22px; accent-color: #3FCF8E"><span style="flex: 1; font-size: 14px; color: #F5F7FA">Run-rate cut 15%</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #3FCF8E">−0.81</span></label>
      <label style="display: flex; gap: 12px; align-items: center; min-height: 56px; border-top: 1px solid #1A222C"><input type="checkbox" checked="checked" style="width: 22px; height: 22px; accent-color: #3FCF8E"><span style="flex: 1; font-size: 14px; color: #F5F7FA">Industrial priority 8%</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #3FCF8E">−0.43</span></label>
      <label style="display: flex; gap: 12px; align-items: center; min-height: 56px; border-top: 1px solid #1A222C"><input type="checkbox" checked="checked" style="width: 22px; height: 22px; accent-color: #3FCF8E"><span style="flex: 1; font-size: 14px; color: #F5F7FA">Fuel rationing 10%</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #3FCF8E">−0.54</span></label>
      <label style="display: flex; gap: 12px; align-items: center; min-height: 56px; border-top: 1px solid #1A222C"><input type="checkbox" style="width: 22px; height: 22px; accent-color: #3FCF8E"><span style="flex: 1; font-size: 14px; color: #F5F7FA">Import acceleration</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #7A8697">0.00</span></label>
      <div style="display: flex; justify-content: space-between; min-height: 48px; align-items: center; border-top: 1px solid #1A222C; font-size: 14px"><span style="color: #AEB8C5">Saved</span><span style="font-family: 'IBM Plex Mono', monospace; color: #F5F7FA">1.78 mbpd</span></div>
    </section>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="padding: 14px; border-radius: 14px; background: #1C0F11; display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #FF8A8D">GDP · NO ACTION</span><span style="font-size: 20px; font-weight: 700; color: #F5F7FA">−0.418%</span></div>
      <div style="padding: 14px; border-radius: 14px; background: #1C0F11; display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #FF8A8D">CPI · NO ACTION</span><span style="font-size: 20px; font-weight: 700; color: #F5F7FA">+0.836%</span></div>
    </div>
    <span style="font-size: 12px; line-height: 1.5; color: #F2C14E">Assumes all 3 sites full (39.0 MB). Tap ⚙ to set the real fill level.</span>
  </div>

  <nav aria-label="Main" style="position: sticky; bottom: 0; z-index: 3; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #1A212A; background: #0A0D11; padding: 6px 4px 18px">
    <a href="Mobile-Home.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #94A0AF; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 18a8 8 0 1 1 16 0"></path><path d="M12 18l4-6"></path></svg>Overview</a>
    <a href="Mobile-Map.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #94A0AF; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"></path></svg>Map</a>
    <a href="M-Risk.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #94A0AF; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3l9 4v5c0 5-4 8-9 9-5-1-9-4-9-9V7z"></path></svg>Risk</a>
    <a href="M-Market.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #94A0AF; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 17l5-6 4 4 8-9"></path></svg>Markets</a>
    <a href="#" aria-current="page" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #5AAEFF; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle></svg>Respond</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1400}}'>

  renderVals() {

  }

</script>
</body>
</html>
