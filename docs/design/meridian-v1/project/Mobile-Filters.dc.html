<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filters sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#5AAEFF}a:hover{color:#9CCEFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #05080B; color: #E6EAEF; font-family: Archivo, system-ui, sans-serif; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 16px; display: flex; flex-direction: column; gap: 14px; opacity: 0.35">
    <div style="height: 44px; border-radius: 12px; background: #0E1319"></div>
    <div style="height: 180px; border-radius: 18px; background: #0E1319"></div>
  </div>

  <section role="dialog" aria-modal="true" aria-labelledby="fs-title" style="position: absolute; left: 0; right: 0; bottom: 0; height: 640px; box-sizing: border-box; background: #121921; border-top: 1px solid #2A3542; border-radius: 22px 22px 0 0; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 22px">
    <div aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #2A3542"></div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h2 id="fs-title" style="margin: 0; font-size: 20px; font-weight: 700; font-stretch: 110%; color: #F5F7FA">Filters</h2>
      <button type="button" style="min-height: 44px; padding: 0 4px; border: 0; background: none; color: #5AAEFF; font-family: Archivo, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Reset</button>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <legend style="padding: 0 0 10px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #94A0AF">REGION</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" aria-pressed="true" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #E6EAEF; background: #E6EAEF; color: #090D12; font-family: Archivo, sans-serif; font-size: 13px; font-weight: 600">All regions</button>
        <button type="button" aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #2A3542; background: transparent; color: #AEB8C5; font-family: Archivo, sans-serif; font-size: 13px">Persian Gulf</button>
        <button type="button" aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #2A3542; background: transparent; color: #AEB8C5; font-family: Archivo, sans-serif; font-size: 13px">Russia / Black Sea</button>
        <button type="button" aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #2A3542; background: transparent; color: #AEB8C5; font-family: Archivo, sans-serif; font-size: 13px">North America</button>
        <button type="button" aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #2A3542; background: transparent; color: #AEB8C5; font-family: Archivo, sans-serif; font-size: 13px">West Africa</button>
        <button type="button" aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #2A3542; background: transparent; color: #AEB8C5; font-family: Archivo, sans-serif; font-size: 13px">Southeast Asia</button>
      </div>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <label for="sev" style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #94A0AF">MIN SEVERITY</label>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #F5F7FA">0.45</span>
      </div>
      <input id="sev" type="range" min="0" max="100" value="45" style="width: 100%; accent-color: #5AAEFF; height: 28px">
      <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #7A8697"><span>show all</span><span>critical only</span></div>
    </div>

    <div style="display: flex; flex-direction: column; border-radius: 14px; border: 1px solid #1F2833; overflow: hidden">
      <label style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 14px; background: #0E1319; border-bottom: 1px solid #1A222C">
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; color: #F5F7FA">Auto-refresh</span><span style="font-size: 12px; color: #94A0AF">every 30 s, paused in background</span></span>
        <input type="checkbox" checked="checked" style="width: 22px; height: 22px; accent-color: #5AAEFF">
      </label>
      <label style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 14px; background: #0E1319">
        <span style="font-size: 14px; color: #F5F7FA">Dark theme</span>
        <input type="checkbox" checked="checked" style="width: 22px; height: 22px; accent-color: #5AAEFF">
      </label>
    </div>

    <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" style="min-height: 48px; border-radius: 12px; border: 1px solid #2A3542; background: #1A222C; color: #F5F7FA; font-family: Archivo, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Force refresh</button>
      <a href="Mobile-Home.dc.html" style="min-height: 48px; border-radius: 12px; background: #5AAEFF; color: #06121F; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Show results</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
