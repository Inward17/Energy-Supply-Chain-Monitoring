<html lang="en">
<head>
<meta charset="utf-8">
<title>Threat map mobile</title>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#5AAEFF}a:hover{color:#9CCEFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B1015; color: #E6EAEF; font-family: Archivo, system-ui, sans-serif; position: relative; overflow: hidden">

  <!-- Map area (basemap placeholder: real build uses the CARTO/Esri tiles) -->
  <div role="img" aria-label="Map of the Gulf region with risk halos at Strait of Hormuz and Bab-el-Mandeb" style="position: absolute; inset: 0; background: radial-gradient(ellipse at 60% 35%, #121A23 0%, #0B1015 70%)">
    <div style="position: absolute; inset: 0; background-image: linear-gradient(#141C25 1px, transparent 1px), linear-gradient(90deg, #141C25 1px, transparent 1px); background-size: 48px 48px; opacity: 0.6"></div>
    <!-- land masses, abstract -->
    <div style="position: absolute; left: -40px; top: 150px; width: 260px; height: 240px; border-radius: 46% 54% 40% 60%; background: #161F29"></div>
    <div style="position: absolute; left: 190px; top: 120px; width: 260px; height: 190px; border-radius: 58% 42% 50% 50%; background: #161F29"></div>
    <div style="position: absolute; left: 30px; top: 360px; width: 180px; height: 170px; border-radius: 40% 60% 55% 45%; background: #161F29"></div>
    <!-- Hormuz halo -->
    <div style="position: absolute; left: 228px; top: 262px; width: 120px; height: 120px; border-radius: 60px; background: rgba(255,138,61,0.16); border: 1px solid rgba(255,138,61,0.5)"></div>
    <div style="position: absolute; left: 280px; top: 314px; width: 16px; height: 16px; border-radius: 8px; background: #FF8A3D; box-shadow: 0 0 0 4px #0B1015, 0 0 0 6px #FF8A3D"></div>
    <!-- Bab-el-Mandeb -->
    <div style="position: absolute; left: 118px; top: 448px; width: 44px; height: 44px; border-radius: 22px; background: rgba(63,207,142,0.14); border: 1px solid rgba(63,207,142,0.45)"></div>
    <div style="position: absolute; left: 134px; top: 464px; width: 12px; height: 12px; border-radius: 6px; background: #3FCF8E"></div>
    <!-- Suez -->
    <div style="position: absolute; left: 66px; top: 218px; width: 12px; height: 12px; border-radius: 6px; background: #3FCF8E"></div>
  </div>

  <!-- Top controls -->
  <div style="position: absolute; top: 16px; left: 16px; right: 16px; display: flex; gap: 8px; align-items: center">
    <a href="Mobile-Home.dc.html" aria-label="Back" style="height: 44px; width: 44px; border-radius: 12px; background: rgba(16,22,29,0.92); border: 1px solid #2A3542; color: #E6EAEF; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <div style="flex: 1; height: 44px; border-radius: 12px; background: rgba(16,22,29,0.92); border: 1px solid #2A3542; display: flex; align-items: center; justify-content: space-between; padding: 0 12px">
      <span style="font-size: 14px; font-weight: 600; color: #F5F7FA">Threat map</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #FF8A8D">0 vessels · AIS off</span>
    </div>
    <a href="Mobile-Filters.dc.html" aria-label="Map layers and filters" style="height: 44px; width: 44px; border-radius: 12px; background: rgba(16,22,29,0.92); border: 1px solid #2A3542; color: #E6EAEF; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg></a>
  </div>

  <!-- Legend chip row -->
  <div style="position: absolute; top: 72px; left: 16px; display: flex; gap: 6px">
    <span style="padding: 6px 10px; border-radius: 14px; background: rgba(16,22,29,0.92); border: 1px solid #2A3542; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #AEB8C5; display: flex; gap: 6px; align-items: center"><span style="width: 8px; height: 8px; border-radius: 4px; background: #FF8A3D"></span>elevated</span>
    <span style="padding: 6px 10px; border-radius: 14px; background: rgba(16,22,29,0.92); border: 1px solid #2A3542; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #AEB8C5; display: flex; gap: 6px; align-items: center"><span style="width: 8px; height: 8px; border-radius: 4px; background: #3FCF8E"></span>low</span>
  </div>

  <!-- Drill-down sheet, half height -->
  <section role="dialog" aria-labelledby="mm-title" style="position: absolute; left: 0; right: 0; bottom: 77px; height: 356px; box-sizing: border-box; background: #121921; border-top: 1px solid #2A3542; border-radius: 22px 22px 0 0; padding: 10px 16px 22px; display: flex; flex-direction: column; gap: 14px">
    <div aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #2A3542"></div>
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: #94A0AF">CHOKEPOINT</span>
        <h2 id="mm-title" style="margin: 0; font-size: 22px; font-weight: 700; font-stretch: 108%; color: #F5F7FA">Strait of Hormuz</h2>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
        <span style="font-size: 32px; line-height: 1; font-weight: 700; font-stretch: 108%; color: #FF8A3D">0.66</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #94A0AF">risk / 1.00</span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="padding: 10px; border-radius: 10px; background: #0C1117; display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #94A0AF">FLOW</span><span style="font-size: 15px; font-weight: 600; color: #F5F7FA">21.0 mbpd</span></div>
      <div style="padding: 10px; border-radius: 10px; background: #0C1117; display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #94A0AF">BRENT IMPACT</span><span style="font-size: 15px; font-weight: 600; color: #FF8A8D">+$2.79</span></div>
      <div style="padding: 10px; border-radius: 10px; background: repeating-linear-gradient(135deg, #0C1117 0 8px, #0F151B 8px 16px); display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #94A0AF">TRANSITS</span><span style="font-size: 15px; font-weight: 600; color: #7A8697">no AIS</span></div>
    </div>
    <div style="padding: 12px; border-radius: 10px; background: #0C1117; border: 1px solid #1F2833; display: flex; flex-direction: column; gap: 4px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #FF8A8D">SETS SCORE · 0.84 · 11 OCT</span>
      <span style="font-size: 13px; line-height: 1.45; color: #E6EAEF">IRGC reports a commercial supertanker exploded in the strait.</span>
    </div>
    <a href="#" style="margin-top: auto; min-height: 48px; border-radius: 12px; background: #5AAEFF; color: #06121F; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Why this score →</a>
  </section>
  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #1A212A; background: #0A0D11; padding: 6px 4px 18px">
    <a href="Mobile-Home.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #94A0AF; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 18a8 8 0 1 1 16 0"></path><path d="M12 18l4-6"></path></svg>Overview</a>
    <a href="#" aria-current="page" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #5AAEFF; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"></path></svg>Map</a>
    <a href="M-Risk.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #94A0AF; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3l9 4v5c0 5-4 8-9 9-5-1-9-4-9-9V7z"></path></svg>Risk</a>
    <a href="M-Market.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #94A0AF; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 17l5-6 4 4 8-9"></path></svg>Markets</a>
    <a href="M-War.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #94A0AF; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle></svg>Respond</a>
  </nav>
</div>
</x-dc>
