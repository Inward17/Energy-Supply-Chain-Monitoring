<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Historical Validation mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#5AAEFF}a:hover{color:#9CCEFF}
</style>
</helmet>
<div style="width: 390px; height: 1400px; box-sizing: border-box; background: #07090C; color: #E6EAEF; font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 12px; border-bottom: 1px solid #1A212A; background: #0A0D11">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#0F1C2B" stroke="#24405F"></circle><path d="M16 4v24M4 16h24" stroke="#24405F" stroke-width="1"></path><circle cx="16" cy="16" r="6" fill="none" stroke="#5AAEFF" stroke-width="2"></circle><circle cx="16" cy="16" r="2" fill="#5AAEFF"></circle></svg>
      <span style="font-size: 16px; font-weight: 700; color: #F5F7FA">Backtests</span>
    </div>
    <button type="button" aria-label="Run new backtest" style="height: 44px; width: 44px; border-radius: 12px; border: 0; background: #5AAEFF; color: #06121F; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
  </header>

  <nav aria-label="Risk views" style="padding: 12px 16px; border-bottom: 1px solid #1A212A">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; border-radius: 12px; background: #0E1319; border: 1px solid #1E2731">
      <a href="M-Risk.dc.html" style="min-height: 40px; border-radius: 9px; background: transparent; color: #AEB8C5; font-size: 13px; display: flex; align-items: center; justify-content: center; text-decoration: none">Live risk</a>
      <a href="#" aria-current="page" style="min-height: 40px; border-radius: 9px; background: #1A2330; color: #F5F7FA; font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center; text-decoration: none">Backtests</a>
    </div>
  </nav>

  <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px">

    <!-- Event switcher -->
    <section aria-label="Backtests" style="display: flex; gap: 10px; overflow-x: auto; margin-right: -16px; padding-right: 16px">
      <a href="#" aria-current="true" style="flex: none; width: 170px; padding: 14px; border-radius: 14px; border: 1px solid #2B4A6B; background: #0F1C2B; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 14px; font-weight: 700; color: #F5F7FA">Red Sea attacks</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #3FCF8E">31 d early</span></a>
      <a href="#" style="flex: none; width: 170px; padding: 14px; border-radius: 14px; border: 1px solid #1E2731; background: #0E1319; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 14px; font-weight: 700; color: #F5F7FA">Israel–Iran war</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #3FCF8E">7 d early</span></a>
      <a href="#" style="flex: none; width: 170px; padding: 14px; border-radius: 14px; border: 1px solid #44201F; background: #1C0F11; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 14px; font-weight: 700; color: #F5F7FA">Russia–Ukraine</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #FF8A8D">failed · retry</span></a>
    </section>

    <!-- Verdict -->
    <section style="background: #0D1A14; border: 1px solid #1E4A36; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #3FCF8E">EARLY WARNING</span>
      <span style="font-size: 40px; font-weight: 700; font-stretch: 108%; color: #F5F7FA">31 days</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <div style="padding: 10px; border-radius: 10px; background: #0A1410; display: flex; flex-direction: column; gap: 3px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #94A0AF">SDI ≥ 65</span><span style="font-size: 14px; font-weight: 600; color: #F5F7FA">19 Nov 2023</span></div>
        <div style="padding: 10px; border-radius: 10px; background: #0A1410; display: flex; flex-direction: column; gap: 3px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #94A0AF">BRENT &gt;1.5σ</span><span style="font-size: 14px; font-weight: 600; color: #F5F7FA">20 Dec 2023</span></div>
      </div>
    </section>

    <!-- Chart -->
    <figure style="margin: 0; background: #0E1319; border: 1px solid #1E2731; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 15px; font-weight: 700; color: #F5F7FA">SDI vs Brent</span>
        <div style="display: flex; gap: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #94A0AF">
          <span style="display: flex; align-items: center; gap: 4px"><span style="width: 10px; height: 3px; background: #5AAEFF"></span>SDI</span>
          <span style="display: flex; align-items: center; gap: 4px"><span style="width: 10px; height: 3px; background: #FFB86B"></span>Brent</span>
        </div>
      </div>
      <svg viewBox="0 0 640 220" width="100%" role="img" aria-label="SDI crossed 65 on 19 November, Brent broke out 31 days later on 20 December">
        <line x1="0" y1="71.2" x2="640" y2="71.2" stroke="#F2C14E" stroke-width="2" stroke-dasharray="6 6"></line>
        <rect x="33.2" y="0" width="257.7" height="200" fill="#5AAEFF" fill-opacity="0.08"></rect>
        <line x1="33.2" y1="0" x2="33.2" y2="200" stroke="#5AAEFF" stroke-width="2"></line>
        <line x1="290.9" y1="0" x2="290.9" y2="200" stroke="#FFB86B" stroke-width="2"></line>
        <text x="162" y="34" text-anchor="middle" fill="#9CCEFF" font-family="IBM Plex Mono, monospace" font-size="22">31 days</text>
        <path d="M0.0 56.6 L33.2 65.5 L41.6 38.8 L66.5 53.6 L99.7 75.3 L116.4 26.6 L133.0 92.4 L157.9 105.7 L182.9 167.8 L224.4 180.4 L241.0 127.8 L274.3 106.9 L290.9 79.6 L340.8 58.3 L365.7 121.1 L399.0 139.1 L423.9 94.3 L448.8 135.5 L482.1 101.6 L523.6 108.0 L565.2 74.0 L598.4 19.6 L623.4 37.5 L640.0 48.3" fill="none" stroke="#FFB86B" stroke-width="3" opacity="0.85" stroke-linejoin="round"></path>
        <path d="M0.0 72.2 L8.3 154.0 L16.6 72.5 L41.6 57.0 L74.8 70.8 L83.1 142.4 L91.4 65.6 L116.4 58.0 L133.0 146.5 L149.6 59.5 L166.2 157.0 L174.5 79.3 L191.2 162.4 L199.5 75.2 L241.0 155.7 L249.4 51.8 L274.3 46.6 L290.9 73.9 L299.2 134.6 L307.5 52.4 L324.2 134.4 L332.5 42.2 L365.7 147.0 L374.0 65.1 L399.0 146.8 L407.3 54.5 L432.2 138.6 L448.8 58.7 L457.1 145.3 L465.5 61.0 L490.4 143.2 L498.7 51.0 L507.0 143.2 L515.3 55.6 L531.9 140.9 L548.6 51.0 L581.8 140.3 L590.1 59.7 L615.1 47.8 L640.0 55.5" fill="none" stroke="#5AAEFF" stroke-width="3" stroke-linejoin="round"></path>
        <text x="0" y="216" fill="#7A8697" font-family="IBM Plex Mono, monospace" font-size="20">15 Nov</text>
        <text x="640" y="216" text-anchor="end" fill="#7A8697" font-family="IBM Plex Mono, monospace" font-size="20">31 Jan</text>
      </svg>
      <span style="font-size: 12px; line-height: 1.5; color: #F2C14E">27 of 78 days had no scored headlines — dips to ~25 are missing news, not calm.</span>
    </figure>

    <!-- Thresholds -->
    <section aria-labelledby="mh-th" style="background: #0E1319; border: 1px solid #1E2731; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <h2 id="mh-th" style="margin: 0; font-size: 15px; font-weight: 700; color: #F5F7FA">Alert threshold vs warning</h2>
      <div style="display: grid; grid-template-columns: 40px 1fr 64px; gap: 8px 10px; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 12px">
        <span style="color: #AEB8C5">≤60</span><div style="height: 12px; border-radius: 3px; background: #1F4A36"></div><span style="text-align: right; color: #F5F7FA">35 d</span>
        <span style="color: #F5F7FA; font-weight: 600">65</span><div style="height: 12px; border-radius: 3px; background: #3FCF8E; width: 88.6%"></div><span style="text-align: right; color: #F5F7FA; font-weight: 600">31 d</span>
        <span style="color: #AEB8C5">70</span><div style="height: 12px; border-radius: 3px; background: #1F4A36; width: 85.7%"></div><span style="text-align: right; color: #F5F7FA">30 d</span>
        <span style="color: #AEB8C5">75</span><div style="height: 12px; border-radius: 3px; background: #6B5A24; width: 14.3%"></div><span style="text-align: right; color: #F2C14E">5 d</span>
        <span style="color: #AEB8C5">80</span><div style="height: 12px; border-radius: 3px; background: repeating-linear-gradient(135deg, #44201F 0 3px, transparent 3px 6px); width: 14.3%"></div><span style="text-align: right; color: #FF8A8D">5 d late</span>
      </div>
    </section>
  </div>

  <nav aria-label="Main" style="position: sticky; bottom: 0; z-index: 3; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #1A212A; background: #0A0D11; padding: 6px 4px 18px">
    <a href="Mobile-Home.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #94A0AF; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 18a8 8 0 1 1 16 0"></path><path d="M12 18l4-6"></path></svg>Overview</a>
    <a href="Mobile-Map.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #94A0AF; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"></path></svg>Map</a>
    <a href="#" aria-current="page" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #5AAEFF; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3l9 4v5c0 5-4 8-9 9-5-1-9-4-9-9V7z"></path></svg>Risk</a>
    <a href="M-Market.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #94A0AF; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 17l5-6 4 4 8-9"></path></svg>Markets</a>
    <a href="M-War.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: #94A0AF; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle></svg>Respond</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
