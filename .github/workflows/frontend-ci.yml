# Frontend CI — runs on every pull request (and push to main) that touches the
# new UI. Three gates, cheapest first, so a type error fails in ~30 s instead
# of after a full build:
#   1. typecheck  — tsc --noEmit
#   2. build      — the same static export Cloudflare Pages deploys
#   3. smoke      — Playwright against that export, desktop + phone
# Cloudflare Pages builds and comments a preview URL on its own (its GitHub
# app); this workflow is what proves the code is correct before merge.
name: Frontend CI

on:
  # No path filter on pull_request: a required check that never starts blocks
  # merging forever. The job always runs and skips its work when frontend/
  # is untouched (see the "changes" step), finishing green in seconds.
  pull_request:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

# A new push to the same PR cancels the run it supersedes.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect frontend changes
        id: changes
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(frontend/|\.github/workflows/frontend-ci\.yml)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "No frontend changes — skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.frontend == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.changes.outputs.frontend == 'true'
        run: npm run typecheck

      - name: Build static export
        if: steps.changes.outputs.frontend == 'true'
        run: npm run build
        env:
          # Closed port: the smoke tests exercise the "backend offline" state,
          # so CI needs no API, database or secrets.
          NEXT_PUBLIC_API_URL: http://127.0.0.1:9

      - name: Install Playwright browser
        if: steps.changes.outputs.frontend == 'true'
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        if: steps.changes.outputs.frontend == 'true'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
