# CodeQL — GitHub's static security analysis (free for public repos). Findings
# appear under Security → Code scanning and as annotations on the PR diff.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC — catches newly published rules

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # The legacy UI is kept for comparison only and is not deployed.
          config: |
            paths-ignore:
              - legacy/**
              - "**/node_modules/**"
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
