# Dependabot — opens PRs to bump dependencies. Each PR runs through the same
# CI as a human PR, so an upgrade that breaks the build is caught before merge.
# Minor/patch bumps are grouped into one weekly PR per ecosystem to keep noise down.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    groups:
      frontend-minor:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (native port) breaks the Next build; @types/node tracks the
      # Node runtime (20/22), not the latest types. Revisit on runtime upgrades.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    groups:
      backend-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
