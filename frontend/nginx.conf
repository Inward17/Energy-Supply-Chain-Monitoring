# Serves the static export (out/). The app uses hash routing (#overview, #map,
# …), so every page is index.html and no rewrite rules are needed.
#
# Security headers mirror public/_headers (used on Cloudflare Pages) except the
# CSP: its connect-src names the production API, which would block a local
# backend. Add a CSP here if this image is ever served publicly.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Hashed build assets never change; cache them hard.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
